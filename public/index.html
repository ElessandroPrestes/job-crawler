<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Crawler - Vagas Encontradas</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-50 min-h-screen font-sans text-slate-800 antialiased selection:bg-blue-200">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200 shadow-sm transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 text-white p-1.5 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <h1 class="text-xl font-extrabold tracking-tight text-slate-900">JobCrawler</h1>
            </div>
            
            <div class="flex items-center gap-4">
                <a href="/docs/" class="text-sm font-medium text-slate-600 hover:text-blue-600 transition-colors flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    API Docs
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Toolbar -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
            <div>
                <h2 class="text-2xl font-bold text-slate-900">Radar de Vagas</h2>
                <p class="text-sm text-slate-500 mt-1">Oportunidades recentes extraídas automaticamente.</p>
            </div>
            <div class="flex items-center gap-2">
                <select id="interval-select" class="rounded-lg border-slate-300 text-sm focus:border-blue-500 focus:ring-blue-500" onchange="loadJobs()">
                    <option value="24h">Últimas 24h</option>
                    <option value="3d">Últimos 3 dias</option>
                </select>
                <button onclick="crawlJobs()" id="refresh-btn" class="inline-flex items-center justify-center gap-2 rounded-lg bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2 transition-all active:scale-95">
                    <svg id="refresh-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span>Atualizar Vagas</span>
                </button>
            </div>
        </div>

        <!-- Feedback Alert (Error) -->
        <div id="error-alert" class="hidden mb-6 rounded-lg bg-red-50 p-4 border border-red-200">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="ml-3">
                    <h3 class="text-sm font-medium text-red-800">Falha ao carregar as vagas</h3>
                    <div id="error-message" class="mt-1 text-sm text-red-700"></div>
                </div>
            </div>
        </div>
        
        <!-- Skeleton Loading State -->
        <div id="loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Injecting 6 skeleton cards -->
            <script>
                for(let i=0; i<6; i++) {
                    document.write(`
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col h-[220px]">
                            <div class="flex justify-between items-start mb-4">
                                <div class="skeleton h-6 bg-slate-200 rounded w-3/4"></div>
                                <div class="skeleton h-5 bg-slate-100 rounded w-16"></div>
                            </div>
                            <div class="skeleton h-4 bg-slate-100 rounded w-1/2 mb-4"></div>
                            <div class="mt-auto space-y-3">
                                <div class="skeleton h-3 bg-slate-100 rounded w-2/3"></div>
                                <div class="skeleton h-3 bg-slate-100 rounded w-1/3"></div>
                            </div>
                        </div>
                    `);
                }
            </script>
        </div>
        
        <!-- Empty State -->
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-24 px-4 text-center rounded-2xl bg-white border border-dashed border-slate-300">
            <div class="h-20 w-20 bg-blue-50 rounded-full flex items-center justify-center mb-4">
                <svg class="w-10 h-10 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012-2v2M7 7h10"></path></svg>
            </div>
            <h3 class="mt-2 text-lg font-semibold text-slate-900">Nenhuma vaga por aqui</h3>
            <p class="mt-1 text-sm text-slate-500 max-w-sm">
                O banco de dados de vagas está vazio no momento. Execute o processo do Crawler através da API para coletar novas oportunidades.
            </p>
            <div class="mt-6">
                <a href="/docs/" class="inline-flex items-center rounded-md bg-blue-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600">
                    Ir para API Docs
                </a>
            </div>
        </div>

        <!-- Jobs Grid -->
        <div id="jobs-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Cards rendered here -->
        </div>

    </main>

    <script>
        // Source logo badges mapping
        const sourceStyles = {
            'linkedin': 'bg-blue-100 text-blue-700 border-blue-200',
            'indeed': 'bg-indigo-100 text-indigo-700 border-indigo-200',
            'gupy': 'bg-emerald-100 text-emerald-700 border-emerald-200',
            'geekhunter': 'bg-purple-100 text-purple-700 border-purple-200',
            'programathor': 'bg-teal-100 text-teal-700 border-teal-200',
            'vagas': 'bg-sky-100 text-sky-700 border-sky-200',
            'glassdoor': 'bg-green-100 text-green-700 border-green-200',
            'solides': 'bg-cyan-100 text-cyan-700 border-cyan-200',
            'catho': 'bg-rose-100 text-rose-700 border-rose-200',
            'infojobs': 'bg-orange-100 text-orange-700 border-orange-200',
            'jooble': 'bg-yellow-100 text-yellow-700 border-yellow-200',
            'jobbol': 'bg-slate-200 text-slate-800 border-slate-300',
            'trampos': 'bg-fuchsia-100 text-fuchsia-700 border-fuchsia-200',
            'default': 'bg-slate-100 text-slate-700 border-slate-200'
        };

        async function crawlJobs() {
            const refreshIcon = document.getElementById('refresh-icon');
            const refreshBtn = document.getElementById('refresh-btn');
            const errorAlert = document.getElementById('error-alert');
            const errorMessage = document.getElementById('error-message');
            const interval = document.getElementById('interval-select').value;
            
            if (refreshBtn.disabled) return;
            
            const originalText = refreshBtn.innerHTML;
            refreshBtn.disabled = true;
            refreshBtn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Buscando em 14 fontes...`;

            try {
                const response = await fetch('/api/crawl/all', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        keyword: 'php laravel node.js typescript backend',
                        location: 'brasil',
                        since: interval
                    })
                });

                const result = await response.json();
                
                if (!response.ok) {
                    throw new Error(result.error || `Crawler falhou (${response.status})`);
                }
                
                console.log(`Crawl finalizado. Vagas encontradas: ${result.data.jobs_found}, Novas: ${result.data.jobs_new}`);
                errorAlert.classList.add('hidden');
            } catch (err) {
                console.error("Erro no crawler:", err);
                errorMessage.textContent = err.message || "Não foi possível realizar o crawl. Verifique se o servidor está rodando.";
                errorAlert.classList.remove('hidden');
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.innerHTML = originalText;
                await loadJobs();
            }
        }

        async function loadJobs() {
            const grid = document.getElementById('jobs-grid');
            const loading = document.getElementById('loading');
            const empty = document.getElementById('empty-state');
            const errorAlert = document.getElementById('error-alert');
            const errorMessage = document.getElementById('error-message');
            const refreshIcon = document.getElementById('refresh-icon');
            const interval = document.getElementById('interval-select').value;
            
            // Reset states
            grid.innerHTML = '';
            grid.classList.add('hidden');
            empty.classList.add('hidden');
            errorAlert.classList.add('hidden');
            loading.classList.remove('hidden');
            
            // Spin icon
            refreshIcon.classList.add('animate-spin');

            try {
                // Adicionamos um tempo mínimo para dar um feedback visual (UX)
                const [response] = await Promise.all([
                    fetch(`/api/jobs?since=${interval}`),
                    new Promise(res => setTimeout(res, 600)) 
                ]);
                
                const result = await response.json();
                
                if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);

                loading.classList.add('hidden');

                if (!result.success || !result.data || result.data.length === 0) {
                    empty.classList.remove('hidden');
                    return;
                }

                grid.classList.remove('hidden');

                result.data.forEach(job => {
                    const card = document.createElement('article');
                    card.className = 'group relative flex flex-col items-start justify-between rounded-2xl bg-white p-6 shadow-sm border border-slate-200 hover:shadow-md hover:border-blue-300 transition-all duration-200';
                    
                    // Priorizar scraped_at para refletir a data em que a vaga foi coletada (pipeline)
                    let dateStr = job.scraped_at || job.published_at || new Date().toISOString();
                    // If it's a date-only string like "YYYY-MM-DD", JS parses it as UTC midnight.
                    // In BRT (UTC-3), this becomes 21:00 the previous day, shifting the date backward.
                    // Appending 'T12:00:00' forces it to be evaluated at noon local time.
                    if (typeof dateStr === 'string' && dateStr.length === 10) {
                        dateStr += 'T12:00:00';
                    } else if (typeof dateStr === 'string' && dateStr.includes(' ')) {
                        // Replace space with T to ensure cross-browser parsing (e.g. Safari)
                        dateStr = dateStr.replace(' ', 'T');
                    }
                    
                    const date = new Date(dateStr).toLocaleDateString('pt-BR');
                    
                    // Style badging based on source
                    const srcStyle = sourceStyles[job.source?.toLowerCase()] || sourceStyles.default;
                    const scoreHtml = job.compatibility_score
                        ? `<div class="mt-2">
                            <span class="inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-bold ${
                                job.compatibility_score >= 90
                                    ? 'bg-green-100 text-green-700 border border-green-200'
                                    : 'bg-blue-100 text-blue-700 border border-blue-200'
                            }">
                                ✓ Match ${job.compatibility_score}%
                            </span>
                           </div>`
                        : '';

                    card.innerHTML = `
                        <div class="flex items-center gap-x-4 text-xs w-full justify-between mb-1">
                            <time datetime="${date}" class="text-slate-500">${date}</time>
                            <span class="relative z-10 rounded-full border px-2.5 py-0.5 font-medium uppercase tracking-wider text-[10px] ${srcStyle}">
                                ${job.source}
                            </span>
                        </div>
                        ${scoreHtml}
                        <div class="group relative w-full mb-3">
                            <h3 class="mt-3 text-lg font-bold leading-6 text-slate-900 group-hover:text-blue-600 transition-colors line-clamp-2">
                                <a href="${job.url}" target="_blank">
                                    <span class="absolute inset-0"></span>
                                    ${job.title}
                                </a>
                            </h3>
                            <p class="mt-1 text-sm leading-6 text-blue-600 font-medium line-clamp-1">${job.company}</p>
                        </div>
                        <div class="mt-auto w-full pt-4 border-t border-slate-100 flex flex-col gap-2">
                            <div class="flex items-center gap-2 text-sm text-slate-500">
                                <svg class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
                                </svg>
                                <span class="truncate">${job.location || 'Não especificado'}</span>
                            </div>
                            <div class="flex items-center gap-2 text-sm text-slate-500">
                                <svg class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 14.15v4.25c0 1.094-.787 2.036-1.872 2.18-2.087.277-4.216.42-6.378.42s-4.291-.143-6.378-.42c-1.085-.144-1.872-1.086-1.872-2.18v-4.25m16.5 0a2.18 2.18 0 00.75-1.661V8.706c0-1.081-.768-2.015-1.837-2.175a48.114 48.114 0 00-3.413-.387m4.5 8.006c-.194.165-.42.295-.673.38A23.978 23.978 0 0112 15.75c-2.648 0-5.195-.429-7.577-1.22a2.016 2.016 0 01-.673-.38m0 0A2.18 2.18 0 013 12.489V8.706c0-1.081.768-2.015 1.837-2.175a48.111 48.111 0 013.413-.387m7.5 0V5.25A2.25 2.25 0 0013.5 3h-3a2.25 2.25 0 00-2.25 2.25v.894m7.5 0a48.667 48.667 0 00-7.5 0M12 12.75h.008v.008H12v-.008z" />
                                </svg>
                                <span>${job.contract_type || 'Presencial/Remoto'}</span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (err) {
                loading.classList.add('hidden');
                errorMessage.textContent = err.message || "Não foi possível conectar à API.";
                errorAlert.classList.remove('hidden');
            } finally {
                refreshIcon.classList.remove('animate-spin');
            }
        }

        // Auto load
        document.addEventListener('DOMContentLoaded', loadJobs);
    </script>
</body>
</html>
