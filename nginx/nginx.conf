user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/yaml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=crawl:10m rate=5r/m;

    server {
        listen 80;
        server_name _;
        absolute_redirect off;
        root /var/www/html/public;
        index index.html index.php;

        include /etc/nginx/security-headers.conf;

        location = /favicon.ico {
            access_log off;
            log_not_found off;
            return 204;
        }

        location = /health {
            access_log off;
            try_files $uri /index.php?$query_string;
        }

        location /docs {
            alias /var/www/html/docs/swagger;
            index index.html;
            try_files $uri $uri/ =404;
        }

        location = /docs/swagger/openapi.yaml {
            alias /var/www/html/docs/swagger/openapi.yaml;
            add_header Content-Type "application/yaml; charset=utf-8";
            add_header Access-Control-Allow-Origin "*";
            add_header Cache-Control "no-cache";
        }

        location ~ /\. {
            deny all;
            return 404;
        }

        location ~* \.(env|log|sql|sh|md|json|lock|xml|ini)$ {
            deny all;
            return 404;
        }

        location ~* ^/(?!index\.php).+\.php$ {
            deny all;
            return 404;
        }

        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        location /api/crawl {
            limit_req zone=crawl burst=2 nodelay;
            limit_req_status 429;
            try_files $uri /index.php?$query_string;
        }

        location /api/ {
            limit_req zone=api burst=10 nodelay;
            limit_req_status 429;
            try_files $uri /index.php?$query_string;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass app:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 180s;
            fastcgi_send_timeout 180s;
            internal;
        }
    }
}
