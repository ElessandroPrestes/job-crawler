name: Security Audit

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  audit:
    name: Composer Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run audit
        id: audit
        run: composer audit --format=json > audit-report.json || echo "VULNERABILITIES_FOUND=true" >> $GITHUB_ENV

      - name: Notify Slack on findings
        if: env.VULNERABILITIES_FOUND == 'true'
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": ":warning: Vulnerabilidades encontradas em ${{ github.repository }} — verifique o relatório de auditoria."
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json
          retention-days: 30
